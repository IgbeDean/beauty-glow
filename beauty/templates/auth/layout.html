<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Glow | {{ title }}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-page-container">
        
        <header class="auth-header">
            <div class="header-top-nav">
                <a href="{{ url_for('main.home') }}" class="back-home"><i class="las la-arrow-left"></i> Shop</a>
            </div>
            <a href="/" class="auth-logo">BEAUTY GLOW</a>
        </header>


       <!-- FLASH MESSAGES -->
        <div class="flash-messages-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="custom-alert alert-{{ category }}">
                            <span>{{ message }}</span>
                            <button type="button" style="background:none; border:none; cursor:pointer; opacity:0.5;" onclick="this.parentElement.remove()">
                                <i class="las la-times"></i>
                            </button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>



        <main class="auth-content">
            {% block content %}{% endblock %}
        </main>




        <footer class="auth-footer-simple">
            <p>&copy; 2026 Beauty Glow. All Rights Reserved.</p>
        </footer>
    </div>






    <script>
         // THIS IS FOR THE FLASH MESSAGES
        document.addEventListener('DOMContentLoaded', function() {
            // Find all flash messages
            const alerts = document.querySelectorAll('.custom-alert');

            alerts.forEach(function(alert) {
                // Set a timer for 3 seconds (3000 milliseconds)
                setTimeout(function() {
                    // Add the hiding class to trigger the CSS animation
                    alert.classList.add('hiding');
                    
                    // Wait for the animation to finish (0.5s) before removing from DOM
                    setTimeout(function() {
                        alert.remove();
                    }, 500);
                    
                }, 3000);
            });
        });
    </script>
</body>
</html>
